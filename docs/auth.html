<!DOCTYPE html>
<html>
<head>
  <title>UnoAllaVolta Auth</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F0F0F'/%3E%3Crect x='11' y='8' width='14' height='18' rx='2.5' fill='%232A2A2A'/%3E%3Crect x='7' y='6' width='14' height='18' rx='2.5' fill='%234A9BAF'/%3E%3C/svg%3E">
</head>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    window.location.href = 'unoallavolta://auth?' + params.toString();
  } else {
    document.body.textContent = params.get('error') || 'Something went wrong.';
  }
</script>

</html>
